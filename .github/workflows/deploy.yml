name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The family's names and portraits live in a secret gist, not in this public repo.
      - name: Add the family portraits
        env:
          FAMILY_GIST_ID: ${{ secrets.FAMILY_GIST_ID }}
        run: |
          if [ -z "$FAMILY_GIST_ID" ]; then
            echo "No FAMILY_GIST_ID secret; building without family portraits."
            exit 0
          fi
          curl -sfSL "https://api.github.com/gists/$FAMILY_GIST_ID" | jq -e -r '.files["family.json"].content' > public/family.json
          jq -e '.kind == "family" and (.people | length) > 0' public/family.json > /dev/null
          echo "Added $(jq '.people | length' public/family.json) family portraits."
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
